name: Import Letterboxd reviews

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: import-letterboxd
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync long Letterboxd reviews from RSS
        run: npm run import:letterboxd:rss
        env:
          LETTERBOXD_USERNAME: foundinframes
          MIN_REVIEW_WORDS: "400"
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Commit review changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Sync Letterboxd reviews"
          file_pattern: content/reviews/*.md
